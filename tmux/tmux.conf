# author: saoge2222 
# Tmux configuration file

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'
set -g @plugin 'sainnhe/tmux-fzf'

# Keymap setting
unbind C-b                    
set -g prefix C-a
bind C-a send-prefix  # Reset prefix
unbind r
bind r   source-file        "~/.config/tmux/tmux.conf" # Refresh config
unbind %
unbind \"
bind s   split-window -v -c "#{pane_current_path}"     # Split pane vertically
bind v   split-window -h -c "#{pane_current_path}"     # Split pane horizontally
bind c   new-window   -c    "#{pane_current_path}"     # Create new window in the same path

# General configuration
set -g  base-index         1
set -g  pane-base-index    1
set -g  mouse              on
set -g  mode-keys          vi
set -g  renumber-windows   on
set -g  set-clipboard      on
set -g  detach-on-destroy  off
set -g  default-terminal   "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Colorscheme
# gruvbox
grey_light="#504945"
grey_dark="#282828"
session_color="#83A598"
window_color="#1F1F1F"
font_color="#\DBCCA7"

# Status line settings 
set -g status-style                 "bg=${grey_dark},fg=${font_color}"
set -g status                       on
set -g status-position              bottom
set -g status-interval              1
set -g status-left                  ""
set -g status-right                 "#[fg=${session_color},bold]  #S |  #{cpu -i 1}  #{mem} "
set -g window-status-current-format "#[fg=${font_color},bg=${window_color},bold] ◈ #I:#W "
set -g window-status-format         "#[fg=${font_color},unbold] #I:#W "
set -g status-justify               left
set -g message-style                "bg=${grey_light},fg=${font_color}"
set -g mode-style                   "bg=${grey_light},fg=${font_color}"
set -g pane-border-style            "fg=${grey_dark}"
set -g pane-active-border-style     "fg=${grey_light}"

# TPM init
run '~/.tmux/plugins/tpm/tpm'
