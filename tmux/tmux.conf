# author: saoge2222 
# Tmux configuration file

# Plugins
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

# Keymap setting
# Keymap prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Config quick refresh
unbind r
bind r source-file "/root/.tmux.conf"
# Pane splitting
unbind %
unbind \"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# General configuration
set -g  base-index         1
set -g  mouse              on
set -g  mode-keys          vi
set -g  renumber-windows   on
set -g  set-clipboard      on
set -g  default-terminal   "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Colors
grey_light="#504945"
grey_dark="#282828"
session_color="#83A598"
font_color="#\DBCCA7"

# Status line settings 
set -g status-style                 "bg=${grey_dark},fg=${font_color}"
set -g status                       on
set -g status-position              bottom
set -g status-interval              1
set -g status-left                  " [#[fg=${session_color},bold] #S] "
set -g status-right                 "[ %H:%M  %b-%d]"
set -g window-status-current-format "#[fg=${font_color},bold]#[underscore][◈ #I:#W]"
set -g window-status-format         "#[fg=${font_color},unbold] #I:#W"
set -g status-justify               centre
set -g message-style                "bg=${grey_light},fg=${font_color}"
set -g mode-style                   "bg=${grey_light},fg=${font_color}"
set -g pane-border-style            "fg=${grey_dark}"
set -g pane-active-border-style     "fg=${grey_light}"
